<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acceso Clientes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0a3d62, #1e5f74);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* LOGO SUPERIOR */
.logo-top {
    margin-bottom: 20px;
}

.logo-top img {
    width: 280px;
}

/* LOGIN */
.login-container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.user-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.login-container h2 {
    margin-bottom: 20px;
    color: #0a3d62;
}

.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    font-size: 14px;
    color: #333;
}

.input-group input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

.input-group input:focus {
    border-color: #0a3d62;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #0a3d62;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #07406b;
}

.error {
    color: red;
    font-size: 13px;
    margin-top: 10px;
}

.footer {
    margin-top: 15px;
    font-size: 14px;
    color: #333;
}
</style>
</head>

<body>

<!-- LOGO ARRIBA -->
<div class="logo-top">
    <img src="img/cajamar.jpg" alt="Logo Cajamar">
</div>

<!-- FORMULARIO -->
<div class="login-container">

    <!-- ICONO USUARIO -->
    <div class="user-icon">
<img src="img/usser.jpg" width="80px" alt="Logo Cajamar">
    </div>

    <h2>Hola, Jordi Miguel</h2>

    <form id="loginForm">
        <div class="input-group">
            <label>Usuario</label>
            <input type="text" id="usuario" placeholder="Introduce tu usuario">
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Introduce tu contraseña">
        </div>

        <button type="submit" class="btn">Entrar</button>

        <div class="error" id="errorMsg"></div>
    </form>

    

</div>

 <!-- BIOMETRIA -->
    <div class="biometric" onclick="usarHuella()"></div>
    <br><br>
    <div style="font-size:12px;">Acceder con huella</div>

    <div class="error" id="errorMsg"></div>

    

</div>

<script>
// Login normal
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    mostrarBloqueo();
});

// Función huella
function usarHuella() {
    let errorMsg = document.getElementById("errorMsg");

    errorMsg.style.color = "black";
    errorMsg.textContent = "Verificando huella...";

    setTimeout(() => {
        mostrarBloqueo();
    }, 1500);
}

// Mensaje bloqueo
function mostrarBloqueo() {
    let errorMsg = document.getElementById("errorMsg");
    errorMsg.style.color = "red";
    errorMsg.textContent = "Su acceso a la banca digital ha sido bloqueado por motivos de seguridad, contacte con oficina para más información.";
}
</script>

</body>
</html>
